set-option -g focus-events on
# Enable Mouse
set -g mouse on

# TPM package manager
set -g @plugin 'tmux-plugins/tpm'
run '~/.tmux/plugins/tpm/tpm'

# vim style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# New panes inherit current directory
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# New windows inherit current directory
bind c new-window -c "#{pane_current_path}"

# colours
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-kitty:RGB"

# Status bar background & foreground
set -g status-style bg=#1e2030,fg=#c8d3f5
set -g status-left-style fg=#82aaff,bg=#1e2030
set -g status-right-style fg=#82aaff,bg=#1e2030

# TokyoNight theme
set -g @plugin 'folke/tokyonight.nvim'
set -g @tokyonight_variant 'moon'
set -g @tokyonight_tmux_status_bg 'default'

set -g status-interval 5
set -g clock-mode-colour "#82aaff"

# vim tmux navigator
set -g @plugin 'christoomey/vim-tmux-navigator'
